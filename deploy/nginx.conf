# =============================================================================
# nginx — the API's front door, and nothing else
# =============================================================================
# This box serves the API. It does NOT serve the frontend.
#
# The app is built and deployed to Firebase Hosting, and reaches this API by
# the address in its own config.json, resolved at runtime. That separation is
# deliberate and it buys three things:
#
#   · the frontend and the data server scale on different axes — static files
#     scale by CDN for nothing, the API scales by CPU and database connections,
#     and this box has two cores
#   · four clients already speak to this API — the staff app, the admin
#     console, the tills and the CRS. The moment there is more than one
#     browser client, one-origin is not a design that can exist
#   · moving the backend to another provider stops requiring a rebuild of
#     every client, which is the only thing that was really tying us to a
#     vendor
#
# The cost is CORS, and it is paid in api/src/server.ts: an allow-LIST of
# origins, plus a maxAge so the browser stops re-asking every few seconds.
# CORS_ORIGIN must name where the app is actually served. When it does not,
# every screen goes empty with no error a clerk can report — so the preflight
# checks it rather than trusting it.
#
# certbot rewrites this file in place when it issues the certificate, adding
# the listen 443 block, the certificate paths and the port-80 redirect. What
# is here is what it starts from.
# =============================================================================

# ── The channel manager's door ───────────────────────────────────────────────
# SU pushes one booking at a time and waits to be told we have it, so anything
# faster than this is somebody else. The API refuses beyond its own limit too;
# this one keeps a flood off the Node process altogether. A zone must live here,
# at http level — conf.d is included inside http — not inside `server`.
limit_req_zone $binary_remote_addr zone=fidato_channel:1m rate=60r/m;

# ── The guest's own door ─────────────────────────────────────────────────────
# ⚠ THE ONE DOOR IN THIS SYSTEM THAT NEEDS NO CREDENTIAL OF ANY KIND, and until
# 19 September it was the one door with NO LIMIT IN FRONT OF IT: /api/guest/
# fell through the plain /api/ block below, while the code inside it carried a
# comment saying nginx had a limit here. It did not. Found by audit.
#
# A real guest opens their page, maybe asks for a code, answers it, and looks at
# their bill — a handful of requests over a few minutes. 30 a minute a source
# with a burst of 10 is far above that and far below what it takes to walk
# tokens or hammer a stolen link. The API keeps its own per-token limits as
# well; this one keeps a flood off the Node process altogether.
limit_req_zone $binary_remote_addr zone=fidato_guest:1m rate=30r/m;

# The hotel's photos on the guest's page (D27-243): up to twenty pictures, each
# its own request, all at once when the page opens - far past the zone above.
# Their own zone: 120 a minute a source, a burst of 30. Each is cached a day.
limit_req_zone $binary_remote_addr zone=fidato_gallery:1m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # The API. 127.0.0.1 only — the Node process is never exposed directly,
    # so TLS terminates here and nothing can reach 8787 from outside.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── The guest's own door ────────────────────────────────────────────
    # Matched before /api/ because nginx prefers the longer prefix. Nothing
    # behind it is authenticated by a staff token — the link's own token is
    # the whole of it — so the limit and the body cap are what stand between
    # this and the open internet. A guest sends a phone number and a
    # six-digit code; 16k is already far more than either.
    location /api/guest/ {
        limit_req zone=fidato_guest burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The hotel's photos (D27-243): a GET of one picture, nothing sent up.
    location ~ ^/api/guest/[^/]+/gallery/[^/]+$ {
        limit_req zone=fidato_gallery burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── A guest's ID photo (D27-207 to D27-212) ─────────────────────────
    # The one upload on the guest's door, and the desk's own at check-in. A
    # regular-expression location, so nginx prefers it to the two prefixes
    # above for exactly these two paths and nothing else.
    #
    # 10m: front and back, 4 MB each at most, and the form around them; the
    # API refuses more than 9 MB itself, before it reads the body.
    #
    # ⚠ proxy_request_buffering off. By default nginx writes a body this size
    # to a temporary FILE before passing it on - and this body is a photo of
    # somebody's passport, not yet encrypted. Nothing of it may touch this
    # server's disk (D27-209): it is passed straight through to the API,
    # which encrypts it in memory.
    location ~ ^/api/guest/[^/]+/id-photo$ {
        limit_req zone=fidato_guest burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 10m;
        proxy_request_buffering off;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/hotels/[^/]+/stays/[^/]+/id-photo$ {
        client_max_body_size 10m;
        proxy_request_buffering off;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # And the way BACK: the desk opening a photo. The API's answer is the
    # decrypted image, and an answer larger than nginx's memory buffers is
    # also written to a temporary file by default. Not this one.
    location ~ ^/api/hotels/[^/]+/online-checkin/id-photos/[^/]+$ {
        proxy_max_temp_file_size 0;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── The channel manager's door, which SU pushes bookings to ─────────
    # Matched before /api/ because nginx prefers the longer prefix. 60 a
    # minute a source with a burst of 20, and a body no larger than a booking
    # could be: SU's message is a few kilobytes, so half a megabyte is already
    # generous and anything above it is not a booking.
    location /api/channel/ {
        limit_req zone=fidato_channel burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 512k;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── The live stream ─────────────────────────────────────────────────
    # ⚠ BUFFERING MUST BE OFF HERE OR THE STREAM IS NOT A STREAM.
    #
    # nginx buffers a proxied response by default and forwards it when the
    # upstream finishes. This response never finishes -- that is the point of
    # it -- so with buffering on the kitchen receives nothing at all, for
    # ever, while every other endpoint works perfectly. It looks like the
    # feature was never built.
    #
    # The timeout is a day rather than 300s because the connection is IDLE by
    # design between orders. The API sends a heartbeat every 20s, which keeps
    # this from ever being reached, but a proxy that closes a working stream
    # every five minutes gives a kitchen a screen that blinks "reconnecting"
    # all through service.
    location ~ ^/api/hotels/[^/]+/live$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # The Fidato Printer installer (D27-362). Firebase's free plan refuses an
    # executable (MEMORY 426), so it is served from here; the owner copies each
    # build to /var/www/fidato-downloads/. This one file, nothing else there.
    # nginx's own types send .exe as application/octet-stream, so it downloads;
    # no add_header here, which would drop the server's headers below.
    location = /downloads/Fidato-Printer-Setup.exe {
        alias /var/www/fidato-downloads/Fidato-Printer-Setup.exe;
    }

    # Health, unproxied and uncached, so a monitor can ask cheaply.
    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        access_log off;
    }

    # Anything else is somebody at the wrong address — usually a person who
    # bookmarked the API instead of the app. Say so in one line rather than
    # returning nginx's default page, which looks like a broken deployment
    # and generates a support call.
    location / {
        default_type text/plain;
        return 404 "This is the Fidato PMS API. The application is elsewhere.\n";
    }

    # Headers. Not a substitute for the checks in the application, but they
    # cost nothing and close the cheap attacks. No X-Frame-Options here: this
    # host renders no pages to frame, and the app that does is served by
    # Firebase under its own headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # HTTPS only, remembered by the browser for a year (D27-340); and the
    # nginx version kept off every answer and error page.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Invoices and CSV exports are the large responses here.
    client_max_body_size 10m;
    gzip on;
    gzip_types application/json text/csv;
    gzip_min_length 1024;
}
