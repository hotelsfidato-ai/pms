# =============================================================================
# nginx — one origin for the site and the API
# =============================================================================
# The frontend and the API share a hostname: the site is served from disk, and
# anything under /api is proxied to the Node process on 127.0.0.1:8787.
#
# ONE ORIGIN IS THE POINT. Split across two hostnames, every request becomes
# cross-origin: the browser preflights each one, CORS_ORIGIN has to be kept in
# step by hand, and a mismatch shows as empty screens with no error a clerk can
# report. Same origin makes that class of fault impossible.
#
# certbot rewrites this file in place when it issues the certificate, adding
# the listen 443 block, the certificate paths and the port-80 redirect. What is
# here is what it starts from.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __ROOT__;
    index index.html;

    # The API. 127.0.0.1 only — the Node process is never exposed directly,
    # so TLS terminates here and nothing can reach 8787 from outside.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A night audit on a large property, or a year-end report, takes
        # longer than the 60s default. A truncated audit is worse than a slow
        # one: it has already posted some of the night's charges.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health, unproxied and uncached, so a monitor can ask cheaply.
    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        access_log off;
    }

    # Hashed assets are immutable — the filename changes when the content
    # does, so a year is safe and correct.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # A single-page application: every unknown path is a route, not a missing
    # file, and must return index.html. Without this a clerk who reloads on
    # /h/5EL/housekeeping gets a 404 from nginx and concludes the system is
    # broken — the commonest SPA deployment fault there is.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must NEVER be cached. It names the hashed bundles, so
    # a stale copy points at files that no longer exist and the site loads to
    # a blank page after every deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Headers. Not a substitute for the checks in the application, but they
    # cost nothing and close the cheap attacks.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Invoices and CSV exports are the large responses here.
    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;
    gzip_min_length 1024;
}
